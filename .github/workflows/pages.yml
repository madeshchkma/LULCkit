name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/bogura_boro_2026/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site/demo
          cp -r docs/. _site/
          cp examples/bogura_boro_2026/Bogura_Boro_Map_10m_2026.tif _site/demo/
          cp examples/bogura_boro_2026/Bogura_Boro_Map_10m_2026_input_preview.png _site/demo/
          cp examples/bogura_boro_2026/outputs/Bogura_Boro_Map_10m_2026_preview.png _site/demo/
          cp examples/bogura_boro_2026/outputs/Bogura_Boro_Map_10m_2026_map.html _site/demo/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
